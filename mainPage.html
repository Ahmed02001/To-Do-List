  <title>Main Page</title>
  <link rel="stylesheet" href="css/mainPage.css">
</head>

          <th>Done</th>
          <th>Task</th>
          <th>Delete</th>
        </tr>
      </thead>

          <td><input type="checkbox" id="check"></td>
          <td>Ch1 CSS</td>
          <td><span>×</span></td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="js/myOwnLib.js"></script>

</body>
</html>
